<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 影叙文化</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#080809;--ink:#f3eee5;--muted:#8b8780;--accent:#ff3b1f;
        --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
        --label:"Bahnschrift","DIN Alternate",Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);
       display:grid;place-items:center;padding:24px;
       background-image:radial-gradient(60% 50% at 50% 40%,rgba(255,59,31,.09),transparent 70%)}
  .box{max-width:560px;text-align:center}
  .num{font-family:var(--label);font-size:clamp(72px,16vw,140px);line-height:.9;font-weight:700;
       letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px rgba(243,238,229,.35)}
  h1{margin:18px 0 10px;font-size:clamp(20px,3vw,28px);letter-spacing:-.02em}
  p{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.9}
  a{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 24px;
    background:var(--ink);color:#0a0a0b;font-size:13px;font-weight:600;text-decoration:none}
  a:hover{background:var(--accent);color:#fff}
  .brand{margin-top:34px;font-family:var(--label);font-size:9px;letter-spacing:.3em;color:rgba(243,238,229,.3)}
</style>
</head>
<body>
  <div class="box">
    <div class="num">404</div>
    <h1>这一页没拍出来</h1>
    <p>链接可能已经失效，或者地址打错了。<br>回首页看片单，或者直接找我们聊。</p>
    <a href="/">回首页 →</a>
    <div class="brand">YINGXU CULTURE · 影叙文化</div>
  </div>
</body>
</html>
